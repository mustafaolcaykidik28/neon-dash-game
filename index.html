<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>NEON RUNNER: DASH</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ─── Reset & Base ─────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
    }

    /* ─── Canvas wrapper ────────────────────────────────────────── */
    #gameWrapper {
      position: relative;
      width: min(100vw, calc(100dvh * 0.56));
      height: 100dvh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    /* ─── Global Leaderboard Overlay ────────────────────────────── */
    #leaderboard {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 255, 153, 0.35);
      border-radius: 10px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow:
        0 0 12px rgba(0, 255, 153, 0.15),
        inset 0 0 20px rgba(0, 255, 153, 0.04);
      min-width: 190px;
      z-index: 10;
      pointer-events: none;
    }

    #leaderboard h2 {
      font-size: 10px;
      letter-spacing: 3px;
      color: #00ff99;
      text-shadow: 0 0 8px #00ff99;
      text-transform: uppercase;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(0, 255, 153, 0.25);
      padding-bottom: 7px;
    }

    #leaderboard ol {
      list-style: none;
      counter-reset: lb;
      margin: 0;
      padding: 0;
    }

    #leaderboard li {
      counter-increment: lb;
      font-size: 10.5px;
      color: rgba(200, 255, 235, 0.85);
      line-height: 1.9;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    #leaderboard li::before {
      content: counter(lb) ". ";
      color: #00ff99;
      text-shadow: 0 0 5px #00ff99;
    }

    #leaderboard li:first-child {
      color: #fff;
      text-shadow: 0 0 6px rgba(0, 255, 153, 0.6);
    }

    /* Change Name Button */
    #changeNameBtn {
      background: transparent;
      border: 1px solid rgba(0, 255, 153, 0.3);
      color: rgba(0, 255, 153, 0.7);
      font-family: 'Courier New', Courier, monospace;
      font-size: 9px;
      margin-top: 10px;
      padding: 5px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      pointer-events: auto;
    }

    #changeNameBtn:hover {
      background: rgba(0, 255, 153, 0.15);
      color: #00ff99;
      border-color: #00ff99;
    }

    /* ─── Audio Controls ────────────────────────────────────────── */
    #muteBtn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 255, 153, 0.35);
      border-radius: 8px;
      color: #00ff99;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 11px;
      padding: 10px 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 20;
      text-shadow: 0 0 5px #00ff99;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    #muteBtn:active {
      transform: scale(0.92);
    }

    /* ─── Name Input UI (Hidden by default) ─────────────────────── */
    #nameInputOverlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(0, 255, 153, 0.5);
      border-radius: 12px;
      padding: 30px;
      display: none;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 255, 153, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 30;
      text-align: center;
      min-width: 250px;
    }

    #nameInputOverlay h3 {
      color: #00ff99;
      margin-bottom: 5px;
      font-size: 18px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ff99;
    }

    #nameInputOverlay p {
      color: #e0fff5;
      font-size: 11px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    #playerName {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #00ccff;
      border-radius: 6px;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      padding: 12px;
      text-align: center;
      margin-bottom: 15px;
      outline: none;
      box-shadow: inset 0 0 10px rgba(0, 204, 255, 0.1);
      text-transform: uppercase;
      width: 100%;
      transition: all 0.2s;
    }

    #playerName:focus {
      border-color: #00ff99;
      box-shadow: inset 0 0 15px rgba(0, 255, 153, 0.2), 0 0 10px rgba(0, 255, 153, 0.2);
    }

    #submitScoreBtn {
      background: rgba(0, 255, 153, 0.15);
      border: 1px solid #00ff99;
      color: #00ff99;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      letter-spacing: 2px;
    }

    #submitScoreBtn:hover {
      background: rgba(0, 255, 153, 0.3);
      box-shadow: 0 0 15px rgba(0, 255, 153, 0.4);
    }

    #submitScoreBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ─── Scanline overlay for CRT vibe ─────────────────────────── */
    #scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.08) 3px,
        rgba(0, 0, 0, 0.08) 4px
      );
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="gameWrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="scanlines"></div>

  <div id="leaderboard">
    <h2>🏆 Global Leaderboard</h2>
    <ol id="leaderboardList">
      <li style="color:#00ff99;">Loading Data...</li>
    </ol>
    <button id="changeNameBtn">CHANGE NAME</button>
  </div>

  <button id="muteBtn">🔊 SOUND ON</button>

  <div id="nameInputOverlay">
    <h3 id="overlayTitle">GAME OVER</h3>
    <p id="overlaySub">SUBMIT YOUR SCORE TO THE CLOUD</p>
    <input type="text" id="playerName" maxlength="12" placeholder="NINJA" autocomplete="off" spellcheck="false" />
    <button id="submitScoreBtn">SUBMIT</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ── 1. Country Location & Flag Logic ────────────────────────────
  let playerFlag = '🌐'; 

  // Converts a 2-letter country code (e.g., "US") into a flag emoji (🇺🇸)
  function getFlagEmoji(countryCode) {
    if (!countryCode || countryCode.length !== 2) return '🌐';
    const codePoints = countryCode
      .toUpperCase()
      .split('')
      .map(char => 127397 + char.charCodeAt(0));
    return String.fromCodePoint(...codePoints);
  }

  // Fetch the player's country using a more robust API (ipapi.co)
  async function fetchPlayerLocation() {
    try {
      // Using ipapi.co as it is generally very reliable
      const response = await fetch('https://ipapi.co/json/');
      const data = await response.json();
      
      if (data && data.country_code) {
        playerFlag = getFlagEmoji(data.country_code);
        console.log("Location detected: " + data.country_code + " " + playerFlag);
      } else {
        throw new Error("No country code in response");
      }
    } catch (error) {
      console.warn("Could not fetch location API, defaulting to globe emoji.");
      playerFlag = '🌐';
    }
  }
  fetchPlayerLocation();

  // ── 2. Supabase Initialization & Sync Logic ───────────────────
  const SUPABASE_URL = "https://gjkjezspzfxdbywgjkiz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_nWkIshLsvRviQfkWXYuf6w_rLqide1L";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
  }

  async function upsertScoreToSupabase(name, score, flag) {
    const { data, error } = await supabaseClient
      .from('leaderboard')
      .select('score')
      .eq('name', name)
      .limit(1);

    if (error) throw error;

    if (data && data.length > 0) {
      const existingScore = data[0].score;
      if (score > existingScore) {
        await supabaseClient
          .from('leaderboard')
          .update({ score: score, flag: flag }) // Update score and ensure latest flag
          .eq('name', name);
      }
    } else {
      await supabaseClient
        .from('leaderboard')
        .insert([{ name: name, score: score, flag: flag }]);
    }
  }

  async function syncOfflineScores() {
    const list = document.getElementById('leaderboardList');
    if (!navigator.onLine) {
      list.innerHTML = '<li style="color:#ffdd00;">[OFFLINE MODE]</li>';
      return;
    }

    let offlineScores = JSON.parse(localStorage.getItem('offline_scores') || '[]');
    if (offlineScores.length > 0) {
      try {
        for (const entry of offlineScores) {
          await upsertScoreToSupabase(entry.name, entry.score, entry.flag);
        }
        localStorage.setItem('offline_scores', '[]'); 
      } catch(err) {
        console.error('Failed to sync offline scores:', err);
      }
    }
    fetchLeaderboard();
  }

  async function fetchLeaderboard() {
    const list = document.getElementById('leaderboardList');
    if (!navigator.onLine) {
      list.innerHTML = '<li style="color:#ffdd00;">[OFFLINE MODE]</li>';
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('leaderboard')
        .select('*')
        .order('score', { ascending: false })
        .limit(5);

      if (error) throw error;

      list.innerHTML = '';
      if (data && data.length > 0) {
        data.forEach(entry => {
          const li = document.createElement('li');
          const flag = entry.flag || '🌐';
          li.innerHTML = `${escapeHTML(entry.name)} ${flag} &mdash; ${entry.score}`;
          list.appendChild(li);
        });
      } else {
        list.innerHTML = '<li>No scores yet</li>';
      }
    } catch (err) {
      console.error('Error fetching leaderboard:', err);
      list.innerHTML = '<li style="color:#ff2244;">Failed to load</li>';
    }
  }

  window.addEventListener('online', syncOfflineScores);
  window.addEventListener('offline', syncOfflineScores);
  syncOfflineScores();

  async function submitScoreToCloud(name, finalScore) {
    const safeName = name.substring(0, 12);
    // Use the dynamic global flag!
    const flag = playerFlag; 
    
    if (!navigator.onLine) {
      let offlineScores = JSON.parse(localStorage.getItem('offline_scores') || '[]');
      offlineScores.push({ name: safeName, score: finalScore, flag: flag });
      localStorage.setItem('offline_scores', JSON.stringify(offlineScores));
      syncOfflineScores(); 
    } else {
      try {
        await upsertScoreToSupabase(safeName, finalScore, flag);
        fetchLeaderboard();
      } catch (err) {
        console.error("Save failed, queueing offline:", err);
        let offlineScores = JSON.parse(localStorage.getItem('offline_scores') || '[]');
        offlineScores.push({ name: safeName, score: finalScore, flag: flag });
        localStorage.setItem('offline_scores', JSON.stringify(offlineScores));
      }
    }
  }


  // ── 3. Audio Setup ────────────────────────────────────────────
  const audioContext = {
    bgm: new Audio('bg_music.mp3'),
    death: new Audio('death.mp3'), 
    initialized: false,
    muted: false
  };
  audioContext.bgm.loop = true;

  function playDeathSound() {
    if (audioContext.initialized && !audioContext.muted) {
      audioContext.death.currentTime = 0;
      audioContext.death.play().catch(e => {});
    }
  }

  const muteBtn = document.getElementById("muteBtn");
  
  function toggleMute(e) {
    e.stopPropagation(); 
    audioContext.muted = !audioContext.muted;
    
    if (audioContext.muted) {
      audioContext.bgm.pause();
      muteBtn.innerText = "🔇 SOUND OFF";
      muteBtn.style.color = "#ff2244";
      muteBtn.style.borderColor = "rgba(255, 34, 68, 0.35)";
      muteBtn.style.textShadow = "0 0 5px #ff2244";
    } else {
      if (audioContext.initialized && gameActive && !isEnteringName) {
        audioContext.bgm.play().catch(e => console.log("Play prevented:", e));
      }
      muteBtn.innerText = "🔊 SOUND ON";
      muteBtn.style.color = "#00ff99";
      muteBtn.style.borderColor = "rgba(0, 255, 153, 0.35)";
      muteBtn.style.textShadow = "0 0 5px #00ff99";
    }
  }

  muteBtn.addEventListener("mousedown", toggleMute);
  muteBtn.addEventListener("touchstart", (e) => { 
    e.preventDefault(); 
    toggleMute(e); 
  }, { passive: false });


  // ── 4. Canvas setup & Scaling ─────────────────────────────────
  const canvas  = document.getElementById("gameCanvas");
  const ctx     = canvas.getContext("2d");
  const wrapper = document.getElementById("gameWrapper");
  let stars     = [];

  function initStars() {
    stars = [];
    for (let i = 0; i < 75; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * (canvas.height * 0.75), 
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random()
      });
    }
  }

  function resizeCanvas() {
    canvas.width  = wrapper.clientWidth;
    canvas.height = wrapper.clientHeight;
    initStars();
  }
  resizeCanvas();
  window.addEventListener("resize", () => { resizeCanvas(); resetGame(); });

  // ── Colour palette ────────────────────────────────────────────
  const CLR = {
    ground:     "#00ff99",   
    player:     "#00ff99",   
    playerGlow: "#00ff9966", 
    block:      "#00ccff",   
    blockInner: "rgba(0, 204, 255, 0.15)",
    spike:      "#ff2244",   
    spikeGlow:  "#ff224466",
    scoreText:  "#00ff99",
    comboText:  "#ffdd00",
    deathFlash: "rgba(255,30,60,",  
    uiText:     "#e0fff5",
    particle:   ["#00ff99","#00ffcc","#00ccff","#ffffff"],
  };

  // ── Physics & Game Constants ──────────────────────────────────
  const GRAVITY         = 0.45;   
  const JUMP_FORCE      = -10.8;  
  const GAME_SPEED_INIT = 4.0;    
  const SPEED_INC       = 0.0005; 

  function groundY()    { return Math.floor(canvas.height * 0.86); }
  function unitSize()   { return Math.floor(canvas.width  * 0.08); } 

  // ── Player State ──────────────────────────────────────────────
  let player = {};
  let isHoldingJump = false;
  let jumpTriggered = false;

  function createPlayer() {
    const size = unitSize();
    return {
      x:         Math.floor(canvas.width * 0.20),
      y:         groundY() - size,                  
      prevY:     groundY() - size,
      vy:        0,                                  
      size:      size,
      onGround:  true,
      rotation:  0,
      jumpsLeft: 2
    };
  }

  // ── Obstacles ─────────────────────────────────────────────────
  let obstacles = [];  
  let spawnDistance = 0;  

  function generateChunk() {
    const u = unitSize();
    const gy = groundY();
    const startX = Math.max(canvas.width + u, obstacles.length > 0 ? obstacles[obstacles.length-1].x + u*2 : 0);
    const r = Math.random();
    let chunkWidth = u;
    const minGap = u * 8.5; 
    
    if (r < 0.10) {
      obstacles.push({ type: 'spike', x: startX, y: gy - u, w: u, h: u, scored: false });
      chunkWidth = u;
    } else if (r < 0.20) {
      obstacles.push({ type: 'spike', x: startX, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u, y: gy - u, w: u, h: u, scored: false });
      chunkWidth = u * 2;
    } else if (r < 0.35) {
      obstacles.push({ type: 'block', x: startX, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX, y: gy - u * 2, w: u, h: u, scored: false });
      chunkWidth = u;
    } else if (r < 0.45) {
      obstacles.push({ type: 'block', x: startX, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'block', x: startX + u, y: gy - u * 2, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u, y: gy - u, w: u, h: u, scored: false });
      chunkWidth = u * 2;
    } else if (r < 0.60) {
      obstacles.push({ type: 'block', x: startX, y: gy - u * 2, w: u, h: u, scored: false });
      obstacles.push({ type: 'block', x: startX + u, y: gy - u * 2, w: u, h: u, scored: false });
      obstacles.push({ type: 'block', x: startX + u * 2, y: gy - u * 2, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u * 2, y: gy - u, w: u, h: u, scored: false });
      chunkWidth = u * 3;
    } else if (r < 0.75) {
      const len = 3 + Math.floor(Math.random() * 2); 
      for (let i = 0; i < len; i++) {
        obstacles.push({ type: 'block', x: startX + i*u, y: gy - u, w: u, h: u, scored: false });
        if (i > 0 && i < len - 1 && Math.random() < 0.6) {
          obstacles.push({ type: 'spike', x: startX + i*u, y: gy - u * 2, w: u, h: u, scored: false });
        }
      }
      chunkWidth = u * len;
    } else if (r < 0.85) {
      obstacles.push({ type: 'block', x: startX, y: gy - u * 3, w: u, h: u, scored: false });
      obstacles.push({ type: 'block', x: startX + u, y: gy - u * 3, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u * 2.5, y: gy - u, w: u, h: u, scored: false });
      chunkWidth = u * 3.5;
    } else {
      obstacles.push({ type: 'block', x: startX, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'block', x: startX + u * 2, y: gy - u * 2, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u * 2, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'block', x: startX + u * 4, y: gy - u, w: u, h: u, scored: false });
      obstacles.push({ type: 'spike', x: startX + u * 3, y: gy - u, w: u, h: u, scored: false });
      chunkWidth = u * 5;
    }

    spawnDistance = chunkWidth + minGap + (Math.random() * u * 2.5);
  }

  // ── Particles ─────────────────────────────────────────────────
  let particles = [];
  function emitBurst(ox, oy, n = 35) {
    for (let i = 0; i < n; i++) {
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      const speed = 3 + Math.random() * 8;
      particles.push({
        x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
        life: 1.0, decay: 0.02 + Math.random() * 0.03, size: 3 + Math.random() * 5,
        colour: CLR.particle[Math.floor(Math.random() * CLR.particle.length)],
      });
    }
  }

  function emitTrail() {
    if (!gameActive) return;
    particles.push({
      x: player.x + Math.random() * 10, y: player.y + player.size - 2,
      vx: -2 - Math.random() * 3, vy: -0.5 - Math.random() * 1.5,
      life: 0.8, decay: 0.06, size: 3 + Math.random() * 3,
      colour: CLR.particle[Math.floor(Math.random() * CLR.particle.length)],
    });
  }

  // ── Game State & Smart Name UI Handling ───────────────────────
  let score              = 0;
  let bestScore          = 0;  
  let gameActive         = false;  
  let gameSpeed          = GAME_SPEED_INIT;
  let frameCount         = 0;      
  let deathFlash         = 0;      
  let gridOffset         = 0;   
  let inputLocked        = false; 
  let isEnteringName     = false;
  let isJustChangingName = false;

  const submitBtn = document.getElementById('submitScoreBtn');
  const nameInput = document.getElementById('playerName');
  const overlay   = document.getElementById('nameInputOverlay');
  const titleText = document.getElementById('overlayTitle');
  const subText   = document.getElementById('overlaySub');

  // Change Name Request
  document.getElementById('changeNameBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    if (gameActive) return; 
    
    isEnteringName = true;
    isJustChangingName = true;
    titleText.innerText = "CHANGE NICKNAME";
    subText.innerText = "UPDATE YOUR SAVED LEADERBOARD NAME";
    nameInput.value = localStorage.getItem('player_nickname') || '';
    overlay.style.display = 'flex';
    nameInput.focus();
  });

  // Submit UI Button
  submitBtn.addEventListener('click', async () => {
    const name = nameInput.value.trim() || 'NINJA';
    localStorage.setItem('player_nickname', name.substring(0, 12));

    if (isJustChangingName) {
      isJustChangingName = false;
      isEnteringName = false;
      overlay.style.display = 'none';
      titleText.innerText = "GAME OVER";
      subText.innerText = "SUBMIT YOUR SCORE TO THE CLOUD";
      return; 
    }
    
    submitBtn.innerText = "SAVING...";
    submitBtn.disabled = true;

    await submitScoreToCloud(name, score);

    submitBtn.innerText = "SUBMIT";
    submitBtn.disabled = false;
    overlay.style.display = 'none';
    isEnteringName = false;
    
    restartSequence();
  });

  function restartSequence() {
    if (!audioContext.muted) {
      audioContext.bgm.currentTime = 0;
      audioContext.bgm.play().catch(e => console.log(e));
    }
    startGame();
  }

  // ── Drawing Helpers ───────────────────────────────────────────
  function drawBlock(x, y, w, h) {
    ctx.save();
    ctx.shadowColor = CLR.block;
    ctx.shadowBlur  = 12;
    ctx.fillStyle   = CLR.blockInner;
    ctx.fillRect(x, y, w, h);
    ctx.shadowBlur  = 0;
    ctx.strokeStyle = CLR.block;
    ctx.lineWidth   = 2.5;
    ctx.strokeRect(x, y, w, h);
    ctx.strokeStyle = "rgba(0, 204, 255, 0.4)";
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + w/2, y); ctx.lineTo(x + w/2, y + h);
    ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2);
    ctx.stroke();
    ctx.fillStyle = CLR.block;
    ctx.fillRect(x - 1, y - 1, 4, 4); ctx.fillRect(x + w - 3, y - 1, 4, 4);
    ctx.fillRect(x - 1, y + h - 3, 4, 4); ctx.fillRect(x + w - 3, y + h - 3, 4, 4);
    ctx.restore();
  }

  function drawSpike(x, y, w, h) {
    ctx.save();
    ctx.shadowColor = CLR.spikeGlow;
    ctx.shadowBlur  = 15;
    ctx.fillStyle   = CLR.spike;
    ctx.strokeStyle = "#ff8899";
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + w/2, y); ctx.lineTo(x + w - 2, y + h); ctx.lineTo(x + 2, y + h);       
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawCyberpunkBackground() {
    const gy = groundY();
    const skyGrad = ctx.createLinearGradient(0, 0, 0, gy);
    skyGrad.addColorStop(0.0, "#05020a");   
    skyGrad.addColorStop(0.4, "#16042b");   
    skyGrad.addColorStop(0.8, "#4a043a");   
    skyGrad.addColorStop(1.0, "#8a0c4f");   
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffffff";
    stars.forEach(star => {
      const pulse = star.alpha * (0.5 + 0.5 * Math.sin(Date.now() / 500 + star.x));
      ctx.globalAlpha = Math.max(0, pulse);
      ctx.fillRect(star.x, star.y, star.size, star.size);
    });
    ctx.globalAlpha = 1.0;

    const sunX = canvas.width / 2;
    const sunY = gy - 15;
    const sunR = Math.min(canvas.width * 0.28, 130);
    ctx.save();
    const sunGrad = ctx.createLinearGradient(0, sunY - sunR, 0, sunY);
    sunGrad.addColorStop(0.0, "#ffdf00"); 
    sunGrad.addColorStop(0.4, "#ff4a00"); 
    sunGrad.addColorStop(1.0, "#c800ff"); 
    ctx.fillStyle = sunGrad;
    ctx.shadowColor = "#ff4a00";
    ctx.shadowBlur = 45;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, Math.PI, 0); ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = "rgba(0,0,0,1)";
    for(let i=0; i < 8; i++) {
      let h = 2 + i * 1.8;
      let y = sunY - i * 12 - 8;
      ctx.fillRect(sunX - sunR - 10, y, sunR * 2 + 20, h);
    }
    ctx.restore();

    ctx.fillStyle = "#0c0214";
    const parallaxSpeed1 = 0.05;
    const mWidth = 60;
    for(let i = -2; i < Math.ceil(canvas.width / mWidth) + 2; i++) {
        let worldIdx = Math.floor((gridOffset * parallaxSpeed1) / mWidth) + i;
        let screenX = i * mWidth - ((gridOffset * parallaxSpeed1) % mWidth);
        let h = 60 + (Math.sin(worldIdx * 3.1) * 40) + (Math.cos(worldIdx * 7.3) * 20);
        if (h < 20) h = 20;
        ctx.fillRect(screenX, gy - h, mWidth + 1, h);
        ctx.strokeStyle = "rgba(100, 0, 200, 0.3)";
        ctx.lineWidth = 1;
        ctx.strokeRect(screenX, gy - h, mWidth + 1, h);
    }

    ctx.fillStyle = "#05010a";
    const bWidth = 35;
    const parallaxSpeed2 = 0.2;
    for(let i = -2; i < Math.ceil(canvas.width / bWidth) + 2; i++) {
        let worldIdx = Math.floor((gridOffset * parallaxSpeed2) / bWidth) + i;
        let screenX = i * bWidth - ((gridOffset * parallaxSpeed2) % bWidth);
        let h = 30 + (Math.sin(worldIdx * 7.1) * 35) + (Math.cos(worldIdx * 13.3) * 55);
        if (h < 15) h = 15;
        ctx.fillRect(screenX, gy - h, bWidth + 1, h);
        ctx.strokeStyle = worldIdx % 3 === 0 ? "rgba(0, 255, 200, 0.55)" : "rgba(255, 0, 128, 0.55)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(screenX, gy - h, bWidth + 1, h);
        
        if (h > 45 && worldIdx % 2 === 0) {
            ctx.fillStyle = "rgba(255, 255, 0, 0.4)";
            ctx.fillRect(screenX + 10, gy - h + 15, 4, 4);
            ctx.fillRect(screenX + 20, gy - h + 15, 4, 4);
            ctx.fillRect(screenX + 10, gy - h + 30, 4, 4);
        }
        ctx.fillStyle = "#05010a"; 
    }
  }

  function drawGround() {
    const gy = groundY();
    ctx.strokeStyle = "rgba(0, 255, 153, 0.15)";
    ctx.lineWidth = 2.5;
    for (let i = 0; i < canvas.width + 100; i += 75) {
       let lineX = (i - (gridOffset * 1.5) % 75);
       ctx.beginPath(); ctx.moveTo(lineX, gy); ctx.lineTo(lineX - 45, canvas.height); ctx.stroke();
    }
    ctx.save();
    ctx.shadowColor = CLR.ground;
    ctx.shadowBlur  = 18;
    ctx.strokeStyle = CLR.ground;
    ctx.lineWidth   = 3;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
    ctx.restore();

    const refGrad = ctx.createLinearGradient(0, gy, 0, gy + 55);
    refGrad.addColorStop(0, "rgba(0,255,153,0.25)");
    refGrad.addColorStop(1, "transparent");
    ctx.fillStyle = refGrad;
    ctx.fillRect(0, gy, canvas.width, 55);
  }

  function drawPlayer() {
    const cx = player.x + player.size / 2;
    const cy = player.y + player.size / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(player.rotation);
    ctx.shadowColor = CLR.playerGlow;
    ctx.shadowBlur  = 20;
    ctx.strokeStyle = CLR.ground;
    ctx.lineWidth   = 2.5;
    ctx.strokeRect(-player.size/2 - 2, -player.size/2 - 2, player.size + 4, player.size + 4);
    ctx.fillStyle = CLR.player;
    ctx.shadowBlur = 10;
    ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.lineWidth   = 3;
    ctx.strokeRect(-player.size/4, -player.size/4, player.size/2, player.size/2);
    ctx.restore();
  }

  function drawObstacles() {
    for (const obs of obstacles) {
      if (obs.type === 'block') drawBlock(obs.x, obs.y, obs.w, obs.h);
      if (obs.type === 'spike') drawSpike(obs.x, obs.y, obs.w, obs.h);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.shadowColor = p.colour;
      ctx.shadowBlur  = 8;
      ctx.fillStyle   = p.colour;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
      ctx.restore();
    }
  }

  function drawHUD() {
    const fs = Math.max(16, Math.floor(canvas.width * 0.055));
    const hudY = 75; 
    ctx.save();
    ctx.font        = `bold ${fs}px 'Courier New', monospace`;
    ctx.textAlign   = "right";
    ctx.fillStyle   = CLR.scoreText;
    ctx.shadowColor = CLR.scoreText;
    ctx.shadowBlur  = 10;
    ctx.fillText(`SCORE  ${score}`, canvas.width - 20, hudY);
    ctx.font        = `${Math.floor(fs * 0.65)}px 'Courier New', monospace`;
    ctx.fillStyle   = "rgba(0,255,153,0.55)";
    ctx.shadowBlur  = 5;
    ctx.fillText(`BEST   ${bestScore}`, canvas.width - 20, hudY + fs * 0.9);
    ctx.restore();
  }

  function drawStartScreen(isDead) {
    if (isEnteringName) return; 

    ctx.fillStyle = "rgba(0,0,0,0.55)"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const cx  = canvas.width  / 2;
    const cy  = canvas.height / 2;
    const titleSize = Math.max(22, Math.floor(canvas.width * 0.10));
    
    ctx.save();
    ctx.font      = `bold ${titleSize}px 'Courier New', monospace`;
    ctx.textAlign = "center";

    if (isDead) {
      ctx.fillStyle   = "#ff2244";
      ctx.shadowColor = "#ff2244";
      ctx.shadowBlur  = 24;
      ctx.fillText("GAME OVER", cx, cy - titleSize * 0.9);

      const scoreSize = Math.floor(titleSize * 0.52);
      ctx.font        = `${scoreSize}px 'Courier New', monospace`;
      ctx.fillStyle   = CLR.uiText;
      ctx.shadowBlur  = 6;
      ctx.fillText(`score: ${score}`, cx, cy - titleSize * 0.15);
      
    } else {
      ctx.fillStyle   = CLR.block;
      ctx.shadowColor = CLR.block;
      ctx.shadowBlur  = 24;
      ctx.fillText("NEON RUNNER", cx, cy - titleSize * 0.6);
    }

    const pulse     = 0.55 + 0.45 * Math.sin(Date.now() / 300);
    const subSize   = Math.max(10, Math.floor(canvas.width * 0.040));
    ctx.font        = `${subSize}px 'Courier New', monospace`;
    
    if (inputLocked) {
      ctx.fillStyle   = `rgba(255, 34, 68, ${pulse})`;
      ctx.shadowColor = "#ff2244";
      ctx.shadowBlur  = 10;
      ctx.fillText("...WAITING...", cx, cy + titleSize * 1.15);
    } else {
      ctx.fillStyle   = `rgba(0,255,153,${pulse})`;
      ctx.shadowColor = CLR.ground;
      ctx.shadowBlur  = 10;
      ctx.fillText("TAP / SPACE TO START (DOUBLE JUMP ENABLED)", cx, cy + titleSize * 1.15);
    }

    ctx.restore();
  }

  // ── Game Management ───────────────────────────────────────────
  function startGame() {
    inputLocked   = false;
    isEnteringName = false;
    player        = createPlayer();
    obstacles     = [];
    particles     = [];
    score         = 0;
    frameCount    = 0;
    gameSpeed     = GAME_SPEED_INIT;
    spawnDistance = canvas.width * 0.6; 
    deathFlash    = 0;
    gameActive    = true;
  }

  function killPlayer() {
    playDeathSound();
    audioContext.bgm.pause(); 
    
    if (score > bestScore) bestScore = score;
    gameActive = false;
    isHoldingJump = false;
    jumpTriggered = false;
    deathFlash = 20;  
    emitBurst(player.x + player.size / 2, player.y + player.size / 2, 40);

    inputLocked = true;
    setTimeout(async () => {
      if (!gameActive) {
        const savedName = localStorage.getItem('player_nickname');
        if (savedName) {
            await submitScoreToCloud(savedName, score);
            inputLocked = false;
            restartSequence();
        } else {
            isEnteringName = true;
            overlay.style.display = 'flex';
            nameInput.value = '';
            nameInput.focus();
        }
      }
    }, 2000); 
  }

  function resetGame() {
    gameActive = false;
    inputLocked = false;
    isEnteringName = false;
    isHoldingJump = false;
    jumpTriggered = false;
    player     = createPlayer();
    obstacles  = [];
    particles  = [];
    score      = 0;
    deathFlash = 0;
  }

  // ── Input Handling ────────────────────────────────────────────
  function handleJumpPress() {
    if (inputLocked || isEnteringName) return; 
    if (!audioContext.initialized) audioContext.initialized = true;
    
    if (!gameActive) {
      if (!audioContext.muted) {
        audioContext.bgm.currentTime = 0; 
        audioContext.bgm.play().catch(e => console.log(e));
      }
      startGame();
      return;
    }
    
    isHoldingJump = true;
    jumpTriggered = true;
  }

  function handleJumpRelease() {
    isHoldingJump = false;
  }

  window.addEventListener("keydown", (e) => {
    if (isEnteringName) return; 
    if (e.code === "Space" && !isHoldingJump) { e.preventDefault(); handleJumpPress(); }
  });
  window.addEventListener("keyup", (e) => {
    if (isEnteringName) return;
    if (e.code === "Space") { e.preventDefault(); handleJumpRelease(); }
  });

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault(); handleJumpPress();
  }, { passive: false });
  canvas.addEventListener("touchend", (e) => {
    e.preventDefault(); handleJumpRelease();
  });

  canvas.addEventListener("mousedown", (e) => {
    e.preventDefault(); handleJumpPress();
  });
  canvas.addEventListener("mouseup", (e) => {
    e.preventDefault(); handleJumpRelease();
  });

  // ── Main Game Loop ────────────────────────────────────────────
  function gameLoop() {
    requestAnimationFrame(gameLoop);

    if (gameActive) gridOffset += gameSpeed * 0.6;

    drawCyberpunkBackground();
    drawGround();

    if (gameActive) {
      frameCount++;
      gameSpeed += SPEED_INC;

      // Jump Logic 
      if (jumpTriggered) {
        if (player.jumpsLeft > 0) {
          if (!player.onGround) {
            emitBurst(player.x + player.size / 2, player.y + player.size, 15);
            player.rotation = 0; 
          }
          player.vy = JUMP_FORCE;
          player.onGround = false;
          player.jumpsLeft--;
        }
        jumpTriggered = false; 
      } else if (player.onGround && isHoldingJump) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        player.jumpsLeft = 1; 
      }

      player.prevY = player.y;

      spawnDistance -= gameSpeed;
      if (spawnDistance <= 0) generateChunk();

      // Move & Score Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;
        if (!obs.scored && obs.x + obs.w < player.x) {
          obs.scored = true;
          score++;
        }
        if (obs.x + obs.w < -50) obstacles.splice(i, 1);
      }

      // Floor Collision
      let floorY = groundY(); 
      const margin = player.size * 0.15; 
      for (const obs of obstacles) {
        if (obs.type === 'block') {
          const pxLeft = player.x + margin;
          const pxRight = player.x + player.size - margin;
          if (pxRight > obs.x && pxLeft < obs.x + obs.w) {
            if (player.prevY + player.size <= obs.y + 12) {
              floorY = Math.min(floorY, obs.y);
            }
          }
        }
      }

      player.vy += GRAVITY;
      player.y  += player.vy;
      let landed = false;

      if (player.y + player.size >= floorY) {
        player.y        = floorY - player.size;
        player.vy       = 0;
        landed          = true;
      }

      // Spike & Wall Crash Detection
      const px = player.x + margin;
      const py = player.y + margin;
      const pw = player.size - margin * 2;
      const ph = player.size - margin * 2;

      for (const obs of obstacles) {
        const ox = obs.x, oy = obs.y, ow = obs.w, oh = obs.h;
        if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
          if (obs.type === 'spike') {
            const sx = obs.x + obs.w * 0.25, sy = obs.y + obs.h * 0.3; 
            const sw = obs.w * 0.5, sh = obs.h * 0.7;
            if (px < sx + sw && px + pw > sx && py < sy + sh && py + ph > sy) {
              killPlayer();
              break;
            }
          } else if (obs.type === 'block') {
            killPlayer();
            break;
          }
        }
      }

      player.onGround = landed;
      if (landed) {
        player.jumpsLeft = 2; 
        player.rotation = Math.round(player.rotation / (Math.PI/2)) * (Math.PI/2);
      } else {
        if (player.jumpsLeft === 2) player.jumpsLeft = 1; 
        player.rotation += 0.08; 
      }

      if (frameCount % 6 === 0 && player.onGround) emitTrail();

      drawParticles(); drawObstacles(); drawPlayer(); drawHUD();

    } else {
      drawParticles(); drawObstacles(); 
      if (deathFlash === 0 && !gameActive && score === 0) drawPlayer(); 
      drawHUD(); drawStartScreen(bestScore > 0 || score > 0);  
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (deathFlash > 0) {
      const alpha = (deathFlash / 20) * 0.5;
      ctx.fillStyle = CLR.deathFlash + alpha + ")";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      deathFlash--;
    }
  }

  // ── Boot ──────────────────────────────────────────────────────
  resetGame();   
  gameLoop();    

})();
</script>
